name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.20.2 matches package.json's engines floor -- verified, not guessed. A first
        # attempt pinning 20.12.0 (when --env-file-if-exists, which this project's own
        # scripts use, was added) failed, but not on this project's own code: c8@12's yargs
        # dependency hit ERR_REQUIRE_ESM specifically on that old patch. Latest 20.x passed,
        # which narrowed it down to "an old-patch-specific c8/yargs/Node ESM interop bug, not
        # a real 20.x-line incompatibility" -- so the floor got moved up to the exact version
        # actually confirmed working, not left claiming a number that had just failed.
        node-version: ["20.20.2", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (with coverage report)
        # Runs the coverage variant instead of a separate `npm test` step -- same tests,
        # same pass/fail signal, but the report shows up in CI logs instead of only ever
        # being seen by whoever remembers to run `npm run coverage` locally.
        run: npm run coverage

      - name: Self-check against the GitHub catalog
        # selfcheck.ts (provided, left unmodified) only prints WARNING text on low
        # provenance or zero edges -- it always exits 0. That's fine for local iteration
        # but useless as a CI gate, so we parse its JSON output here and fail the job
        # ourselves if the thresholds aren't met.
        run: |
          npm run selfcheck > selfcheck_output.txt 2>&1
          cat selfcheck_output.txt
          node -e '
            const fs = require("fs");
            const out = fs.readFileSync("selfcheck_output.txt", "utf-8");
            const match = out.match(/\{[\s\S]*\}/);
            if (!match) { console.error("could not find selfcheck JSON output"); process.exit(1); }
            const r = JSON.parse(match[0]);
            if (r.provenance_ratio < 0.8) { console.error(`provenance_ratio ${r.provenance_ratio} < 0.8`); process.exit(1); }
            if (r.edges === 0) { console.error("0 edges"); process.exit(1); }
            console.log("selfcheck gate passed:", r);
          '

      - name: Check graph.html is up to date with the source
        # graph.html is committed (it's the live GitHub Pages deployment) but generated,
        # and nothing previously verified it actually matches what generate.ts currently
        # produces -- change the matching/schema logic, forget to regenerate and commit
        # graph.html, and the live page silently drifts from the source that generated it.
        # The self-check step above already regenerated it against HEAD; diff that against
        # what's actually committed.
        run: |
          git diff --exit-code -- graph.html || {
            echo "::error::graph.html is out of date with the current generator. Run 'npm run generate -- github_catalog.json' and commit the result.";
            exit 1;
          }
