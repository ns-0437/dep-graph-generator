d"},{"from":"GITHUB_CREATE_A_GIST_COMMENT","to":"GITHUB_UPDATE_PULL_REQUEST_REVIEW_COMMENT","label":"comment_id"},{"from":"GITHUB_CREATE_AN_ISSUE_COMMENT","to":"GITHUB_UPDATE_PULL_REQUEST_REVIEW_COMMENT","label":"comment_id"},{"from":"GITHUB_CREATE_A_GITHUB_PAGES_SITE","to":"GITHUB_UPDATE_PULL_REQUEST_REVIEW_PROTECTION","label":"branch"},{"from":"GITHUB_CREATE_OR_UPDATE_GITHUB_PAGES_SITE","to":"GITHUB_UPDATE_PULL_REQUEST_REVIEW_PROTECTION","label":"branch"},{"from":"GITHUB_GET_PAGES_SITE","to":"GITHUB_UPDATE_PULL_REQUEST_REVIEW_PROTECTION","label":"branch"},{"from":"GITHUB_CREATE_AN_ORGANIZATION_WEBHOOK","to":"GITHUB_UPDATE_REPOSITORY_WEBHOOK_CONFIGURATION","label":"hook_id"},{"from":"GITHUB_CREATE_A_REPOSITORY_WEBHOOK","to":"GITHUB_UPDATE_REPOSITORY_WEBHOOK_CONFIGURATION","label":"hook_id"},{"from":"GITHUB_LIST_ORGANIZATION_WEBHOOKS","to":"GITHUB_UPDATE_REPOSITORY_WEBHOOK_CONFIGURATION","label":"hook_id"},{"from":"GITHUB_GET_A_WEBHOOK_DELIVERY_FOR_AN_ORGANIZATION_WEBHOOK","to":"GITHUB_UPDATE_RESOURCE_ACCESS_WITH_TOKENS","label":"action"},{"from":"GITHUB_GET_CHECK_RUN","to":"GITHUB_UPDATE_RESOURCE_ACCESS_WITH_TOKENS","label":"action"},{"from":"GITHUB_GET_GITHUB_META_INFORMATION","to":"GITHUB_UPDATE_RESOURCE_ACCESS_WITH_TOKENS","label":"action"},{"from":"GITHUB_CREATE_A_SCOPED_ACCESS_TOKEN","to":"GITHUB_UPDATE_RESOURCE_ACCESS_WITH_TOKENS","label":"pat_ids"},{"from":"GITHUB_LIST_ORG_RESOURCE_ACCESS_TOKENS","to":"GITHUB_UPDATE_RESOURCE_ACCESS_WITH_TOKENS","label":"pat_ids"},{"from":"GITHUB_LIST_ORG_RESOURCES_WITH_PERSONAL_TOKENS","to":"GITHUB_UPDATE_RESOURCE_ACCESS_WITH_TOKENS","label":"pat_ids"},{"from":"GITHUB_CREATE_A_GITHUB_PAGES_SITE","to":"GITHUB_UPDATE_STATUS_CHECK_PROTECTION","label":"branch"},{"from":"GITHUB_CREATE_OR_UPDATE_GITHUB_PAGES_SITE","to":"GITHUB_UPDATE_STATUS_CHECK_PROTECTION","label":"branch"},{"from":"GITHUB_GET_PAGES_SITE","to":"GITHUB_UPDATE_STATUS_CHECK_PROTECTION","label":"branch"},{"from":"GITHUB_CREATE_A_SCOPED_ACCESS_TOKEN","to":"GITHUB_UPDATE_TOKEN_ORG_ACCESS","label":"pat_id"},{"from":"GITHUB_LIST_ORG_RESOURCE_ACCESS_TOKENS","to":"GITHUB_UPDATE_TOKEN_ORG_ACCESS","label":"pat_id"},{"from":"GITHUB_LIST_ORG_RESOURCES_WITH_PERSONAL_TOKENS","to":"GITHUB_UPDATE_TOKEN_ORG_ACCESS","label":"pat_id"},{"from":"GITHUB_CREATE_USER_LIST","to":"GITHUB_UPDATE_USER_LIST","label":"list_id"},{"from":"GITHUB_LIST_WATCHERS","to":"GITHUB_UPDATE_USER_LIST","label":"list_id"},{"from":"GITHUB_ADD_ITEM_TO_USER_PROJECT","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_CLEAR_REPOSITORY_CACHE_BY_KEY","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_CREATE_DRAFT_ITEM_FOR_USER_PROJECT","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"item_id"},{"from":"GITHUB_CREATE_USER_LIST","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"list_ids"},{"from":"GITHUB_LIST_WATCHERS","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"list_ids"},{"from":"GITHUB_UPDATE_USER_LIST","to":"GITHUB_UPDATE_USER_LISTS_FOR_ITEM","label":"list_ids"},{"from":"GITHUB_ADD_FIELD_TO_USER_PROJECT","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"projectId"},{"from":"GITHUB_ADD_ITEM_TO_USER_PROJECT","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"projectId"},{"from":"GITHUB_CREATE_AN_ORGANIZATION_PROJECT","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"projectId"},{"from":"GITHUB_ADD_ITEM_TO_USER_PROJECT","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"itemId"},{"from":"GITHUB_CLEAR_REPOSITORY_CACHE_BY_KEY","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"itemId"},{"from":"GITHUB_CREATE_DRAFT_ITEM_FOR_USER_PROJECT","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"itemId"},{"from":"GITHUB_ADD_FIELD_TO_USER_PROJECT","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"fieldId"},{"from":"GITHUB_DELETE_PROJECT_COLUMN","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"fieldId"},{"from":"GITHUB_LIST_PROJECT_FIELDS_FOR_USER","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"fieldId"},{"from":"GITHUB_ADD_OR_UPDATE_TEAM_PROJECT_PERMISSIONS","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"value"},{"from":"GITHUB_GET_AN_ENVIRONMENT_VARIABLE","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"value"},{"from":"GITHUB_GET_AN_ISSUE","to":"GITHUB_UPDATE_USER_PROJECT_ITEM","label":"value"},{"from":"GITHUB_CREATE_A_RELEASE","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_GET_A_RELEASE_BY_TAG_NAME","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_GET_THE_LATEST_RELEASE","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"release_id"},{"from":"GITHUB_CREATE_OR_UPDATE_FILE_CONTENTS","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"content_type"},{"from":"GITHUB_GET_REPOSITORY_CONTENT","to":"GITHUB_UPLOAD_RELEASE_ASSET","label":"content_type"},{"from":"GITHUB_COMMIT_MULTIPLE_FILES","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_COMPARE_TWO_COMMITS","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_CREATE_A_COMMIT","to":"GITHUB_UPLOAD_SARIF_ANALYSIS","label":"commit_sha"},{"from":"GITHUB_SEARCH_CODE","to":"GITHUB_UPSERT_REPO_CUSTOM_PROPERTY_VALUES","label":"properties"},{"from":"GITHUB_SEARCH_CODE_ALL_PAGES","to":"GITHUB_UPSERT_REPO_CUSTOM_PROPERTY_VALUES","label":"properties"},{"from":"GITHUB_SEARCH_ISSUES_AND_PULL_REQUESTS","to":"GITHUB_UPSERT_REPO_CUSTOM_PROPERTY_VALUES","label":"properties"},{"from":"GITHUB_CREATE_A_CODESPACE_FOR_THE_AUTHENTICATED_USER","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"},{"from":"GITHUB_CREATE_A_CODESPACE_FROM_A_PULL_REQUEST","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"},{"from":"GITHUB_CREATE_A_CODESPACE_IN_A_REPOSITORY","to":"GITHUB_VERIFY_DEV_CONTAINER_PERMISSIONS_ACCEPTED","label":"devcontainer_path"}]};
(function () {
  "use strict";
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const tooltip = document.getElementById("tooltip");
  const searchBox = document.getElementById("search");
  const showIsolatedBox = document.getElementById("show-isolated");
  const matchCountEl = document.getElementById("match-count");
  const loadingEl = document.getElementById("loading");

  const degree = new Map();
  for (const n of GRAPH.nodes) degree.set(n.id, 0);
  for (const e of GRAPH.edges) {
    degree.set(e.from, (degree.get(e.from) || 0) + 1);
    degree.set(e.to, (degree.get(e.to) || 0) + 1);
  }
  document.getElementById("counts").textContent =
    GRAPH.nodes.length + " nodes total (" + [...degree.values()].filter((d) => d > 0).length +
    " with at least one edge) · " + GRAPH.edges.length + " edges";

  function serviceColor(service) {
    const s = service || "unknown";
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return "hsl(" + (h % 360) + ",55%,60%)";
  }

  let nodes = [];
  let nodeById = new Map();
  let edges = [];

  function buildDataset(includeIsolated) {
    const filtered = includeIsolated ? GRAPH.nodes : GRAPH.nodes.filter((n) => (degree.get(n.id) || 0) > 0);
    nodes = filtered.map((n) => ({
      id: n.id,
      service: n.service,
      color: serviceColor(n.service),
      x: (Math.random() - 0.5) * 800,
      y: (Math.random() - 0.5) * 800,
      vx: 0,
      vy: 0,
      degree: degree.get(n.id) || 0,
    }));
    nodeById = new Map(nodes.map((n) => [n.id, n]));
    edges = GRAPH.edges.filter((e) => nodeById.has(e.from) && nodeById.has(e.to));
  }

  function layout(iterations) {
    const n = nodes.length;
    if (n === 0) return;
    const area = Math.max(n * 4000, 200000);
    const k = Math.sqrt(area / n);
    for (let iter = 0; iter < iterations; iter++) {
      for (let i = 0; i < n; i++) {
        let fx = 0, fy = 0;
        const a = nodes[i];
        for (let j = 0; j < n; j++) {
          if (i === j) continue;
          const b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let d2 = dx * dx + dy * dy || 0.01;
          const rep = (k * k) / d2;
          const d = Math.sqrt(d2);
          fx += (dx / d) * rep;
          fy += (dy / d) * rep;
        }
        fx -= a.x * 0.002;
        fy -= a.y * 0.002;
        a.vx = (a.vx + fx) * 0.35;
        a.vy = (a.vy + fy) * 0.35;
      }
      for (const e of edges) {
        const a = nodeById.get(e.from), b = nodeById.get(e.to);
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const attr = (d * d) / k - k;
        const ux = dx / d, uy = dy / d;
        a.vx += ux * attr * 0.15;
        a.vy += uy * attr * 0.15;
        b.vx -= ux * attr * 0.15;
        b.vy -= uy * attr * 0.15;
      }
      for (const node of nodes) {
        node.x += Math.max(-30, Math.min(30, node.vx));
        node.y += Math.max(-30, Math.min(30, node.vy));
      }
    }
  }

  let view = { x: 0, y: 0, scale: 0.6 };
  let dragging = null;
  let panning = false;
  let panStart = null;
  let highlight = null;

  // canvas.width/height are the drawing-buffer resolution (scaled up by devicePixelRatio
  // below, for crisp rendering on retina/high-DPI screens); cssWidth/cssHeight are the
  // logical size the layout math and screen<->world mapping actually reason in, matching
  // what the CSS/mouse-event coordinate space uses. Without this split, drawing at
  // canvas.width (post-DPR-scaling, e.g. 1.5x the CSS size) while a devicePixelRatio ctx
  // scale is also applied would double-scale everything.
  let cssWidth = 0, cssHeight = 0;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    cssWidth = window.innerWidth;
    cssHeight = window.innerHeight - 46;
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", () => { resize(); draw(); });

  function toScreen(x, y) {
    return [cssWidth / 2 + (x + view.x) * view.scale, cssHeight / 2 + (y + view.y) * view.scale];
  }
  function toWorld(sx, sy) {
    return [(sx - cssWidth / 2) / view.scale - view.x, (sy - cssHeight / 2) / view.scale - view.y];
  }

  function draw() {
    ctx.fillStyle = "#0b0d12";
    ctx.fillRect(0, 0, cssWidth, cssHeight);
    ctx.lineWidth = 1;
    for (const e of edges) {
      const a = nodeById.get(e.from), b = nodeById.get(e.to);
      const dim = highlight && highlight !== e.from && highlight !== e.to;
      ctx.strokeStyle = dim ? "rgba(120,130,150,0.06)" : "rgba(140,170,220,0.35)";
      const [ax, ay] = toScreen(a.x, a.y);
      const [bx, by] = toScreen(b.x, b.y);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
      if (!dim) {
        const angle = Math.atan2(by - ay, bx - ax);
        const headLen = 5;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx - headLen * Math.cos(angle - 0.4), by - headLen * Math.sin(angle - 0.4));
        ctx.lineTo(bx - headLen * Math.cos(angle + 0.4), by - headLen * Math.sin(angle + 0.4));
        ctx.closePath();
        ctx.fillStyle = "rgba(140,170,220,0.5)";
        ctx.fill();
      }
    }
    for (const node of nodes) {
      const [x, y] = toScreen(node.x, node.y);
      const r = Math.max(3, Math.min(10, 3 + node.degree * 0.6));
      const dim = highlight && highlight !== node.id && !edges.some((e) => (e.from === highlight && e.to === node.id) || (e.to === highlight && e.from === node.id));
      const matches = searchBox.value && node.id.toLowerCase().includes(searchBox.value.toLowerCase());
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = dim && !matches ? "rgba(120,130,150,0.15)" : node.color;
      ctx.fill();
      if (matches) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      if (view.scale > 0.9 || matches || node.id === highlight) {
        ctx.fillStyle = dim && !matches ? "rgba(120,130,150,0.3)" : "#c3c9d4";
        ctx.font = "10px -apple-system,Segoe UI,sans-serif";
        ctx.fillText(node.id, x + r + 3, y + 3);
      }
    }
  }

  function nodeAt(sx, sy) {
    const [wx, wy] = toWorld(sx, sy);
    for (let i = nodes.length - 1; i >= 0; i--) {
      const node = nodes[i];
      const dx = node.x - wx, dy = node.y - wy;
      if (Math.sqrt(dx * dx + dy * dy) < 10) return node;
    }
    return null;
  }

  canvas.addEventListener("mousedown", (ev) => {
    const rect = canvas.getBoundingClientRect();
    const sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
    const hit = nodeAt(sx, sy);
    if (hit) {
      dragging = hit;
    } else {
      panning = true;
      panStart = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
    }
  });
  window.addEventListener("mousemove", (ev) => {
    const rect = canvas.getBoundingClientRect();
    const sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
    if (dragging) {
      const [wx, wy] = toWorld(sx, sy);
      dragging.x = wx;
      dragging.y = wy;
      draw();
      return;
    }
    if (panning) {
      view.x = panStart.vx + (ev.clientX - panStart.x) / view.scale;
      view.y = panStart.vy + (ev.clientY - panStart.y) / view.scale;
      draw();
      return;
    }
    const hit = nodeAt(sx, sy);
    if (hit) {
      canvas.style.cursor = "pointer";
      tooltip.style.display = "block";
      tooltip.style.left = ev.clientX + 12 + "px";
      tooltip.style.top = ev.clientY + 12 + "px";
      const out = edges.filter((e) => e.from === hit.id);
      const inc = edges.filter((e) => e.to === hit.id);
      tooltip.innerHTML =
        '<div class="slug">' + hit.id + "</div>" +
        (hit.service ? "service: " + hit.service + "<br/>" : "") +
        "supplies " + out.length + " field(s) to other tools<br/>" +
        "needs " + inc.length + " field(s) from other tools" +
        (inc.length ? "<br/><br/>" + inc.slice(0, 6).map((e) => e.label + " &larr; " + e.from).join("<br/>") : "");
    } else {
      canvas.style.cursor = "grab";
      tooltip.style.display = "none";
    }
  });
  window.addEventListener("mouseup", () => { dragging = null; panning = false; });
  canvas.addEventListener("click", (ev) => {
    const rect = canvas.getBoundingClientRect();
    const hit = nodeAt(ev.clientX - rect.left, ev.clientY - rect.top);
    highlight = hit ? hit.id : null;
    draw();
  });
  canvas.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 1.1 : 0.9;
    view.scale = Math.max(0.05, Math.min(6, view.scale * factor));
    draw();
  });

  searchBox.addEventListener("input", () => {
    const q = searchBox.value.trim().toLowerCase();
    matchCountEl.textContent = q ? nodes.filter((n) => n.id.toLowerCase().includes(q)).length + " match(es)" : "";
    draw();
  });
  showIsolatedBox.addEventListener("change", () => {
    if (loadingEl) loadingEl.style.display = "flex";
    setTimeout(() => {
      buildDataset(showIsolatedBox.checked);
      layout(showIsolatedBox.checked ? 120 : 220);
      draw();
      if (loadingEl) loadingEl.style.display = "none";
    }, 0);
  });

  resize();
  // The force layout for a few hundred nodes is O(n^2) per iteration and runs
  // synchronously -- on the full GitHub catalog it blocks the main thread for over a
  // second. setTimeout(fn, 0) defers that work to its own event-loop turn, after the
  // browser has already painted the "Laying out the graph..." message, instead of the
  // page appearing frozen/blank the whole time. (requestAnimationFrame would be the more
  // idiomatic choice, but isn't guaranteed to fire promptly in every embedding context --
  // setTimeout is the more universally reliable primitive for "yield, then run this".)
  setTimeout(() => {
    buildDataset(false);
    layout(220);
    draw();
    if (loadingEl) loadingEl.style.display = "none";
  }, 0);
})();
</script>
